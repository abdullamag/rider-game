let seed=20261029;
function rnd(){ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; }
function hash(x,y,k=0){
  let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(k|0,2246822519);
  h=Math.imul(h^(h>>>13),1274126177);
  return (h^(h>>>16))>>>0;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function hex(c){ const n=parseInt(c.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(c1,c2,t){ const a=hex(c1),b=hex(c2); return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`; }
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return [c,g]; }

function layout(){
  const vv=window.visualViewport;
  const iw=Math.round(vv?vv.width:innerWidth), ih=Math.round(vv?vv.height:innerHeight);
  PORTRAIT=ih>iw; LAY_IW=iw;

  game.style.width=GL+'px'; game.style.height=GS+'px';
  game.style.transform=PORTRAIT?`translate(${iw}px,0) rotate(90deg)`:'none';
  const dpr=Math.min(window.devicePixelRatio||1,3);
  DS=Math.max(1,Math.round(GS*dpr/200));
  VH=Math.ceil(GS*dpr/DS); VW=Math.ceil(GL*dpr/DS);
  cv.width=VW; cv.height=VH; snap.width=VW; snap.height=VH;
  disp.width=Math.round(GL*dpr); disp.height=Math.round(GS*dpr);
  disp.style.width=GL+'px'; disp.style.height=GS+'px';

  GSY=Math.round(VH*0.6);
  if(stick.id===null) placeStickIdle();
}
const camOY=()=>GY*T-GSY;
function solid(tx,ty){ return ty>=GY || tx<0 || tx>=W; }

// ================= генерация спрайтов =================
function blobShade(g,w,h,clusters,pal,sd,speck,nz=0.22){
  const id=g.getImageData(0,0,w,h), D=id.data;
  const mask=new Uint8Array(w*h), val=new Float32Array(w*h), who=new Int16Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let best=0, nx=0, ny=0, bi=-1;
    for(let qi=0;qi<clusters.length;qi++){
      const q=clusters[qi], sq=q.sq||1;
      const dx=(x+0.5-q.x)/q.r, dy=(y+0.5-q.y)/(q.r*sq), v=1-(dx*dx+dy*dy);
      if(v>best){ best=v; nx=dx; ny=dy; bi=qi; }
    }
    if(best<=0) continue;
    const i=y*w+x; mask[i]=1; who[i]=bi;
    const lit=nx*-0.55+ny*-0.82;
    const noise=((hash(x,y,sd)%100)/100-0.5)*nz;
    val[i]=0.46+0.52*lit+(1-y/h)*0.1+noise;
  }
  const P=pal.map(hex);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=y*w+x; if(!mask[i]) continue;
    const edge=x===0||y===0||x===w-1||y===h-1||!mask[i-1]||!mask[i+1]||!mask[i-w]||!mask[i+w];
    const seam=!edge&&((mask[i-w]&&who[i-w]!==who[i]&&val[i]<val[i-w])||(mask[i-1]&&who[i-1]!==who[i]&&val[i]<val[i-1]));
    let c;
    if(edge) c=P[0];
    else if(seam) c=P[1];
    else{
      const k=clamp(Math.floor(val[i]*(P.length-1))+1,1,P.length-1);
      c=P[k];
      if(speck && hash(x,y,sd+7)%speck.rate===0) c=hex(speck.col);
    }
    D[i*4]=c[0]; D[i*4+1]=c[1]; D[i*4+2]=c[2]; D[i*4+3]=255;
  }
  g.putImageData(id,0,0);
}

const GREENS=['#111c18','#172a22','#1f3a2d','#294c37','#356042','#47764c','#5f8c55'];
const HAZY  =['#2c3644','#344050','#3d4b5b','#475767','#526373','#5f7080'];
const ORE   =['#24222f','#353346','#47455c','#5a5872','#6e6c88','#84829e'];
const TRUNK =['#2b2019','#45362a','#644f3b'];
const HTRUNK=['#3c4152','#4a5063','#5a6174'];
const ROCK  =['#2c2d44','#3b3e5a','#4d5071','#606588','#757a9b','#8d92b0'];
const FAR   =['#6d6687','#776f92','#81799c','#8c84a6','#978fb0'];

function makeTree(sd,w,h,pal,tp){
  const [c,g]=mkCanvas(w,h);
  let s=sd>>>0; const r=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  const tx=Math.round(w/2), tw=Math.max(3,Math.round(w*0.09)), top=Math.round(h*0.4);
  for(let y=top;y<h;y++){
    const k=(y-top)/(h-top);
    const bend=Math.round(Math.sin(k*3+sd)*1.3);
    const ww=tw+(k>0.82?Math.round((k-0.82)*w*0.5):0);
    const x0=tx-Math.floor(ww/2)+bend;
    g.fillStyle=tp[1]; g.fillRect(x0,y,ww,1);
    g.fillStyle=tp[0]; g.fillRect(x0+ww-1,y,1,1);
    g.fillStyle=tp[2]; g.fillRect(x0,y,1,1);
    if(r()<0.14){ g.fillStyle=tp[0]; g.fillRect(x0+1+Math.floor(r()*Math.max(1,ww-2)),y,1,2); }
  }
  g.fillStyle=tp[1];
  for(let b=0;b<3;b++){
    const sy=top+Math.round(r()*h*0.14), dir=b%2?1:-1, len=Math.round(w*0.18+r()*w*0.1);
    for(let i=0;i<len;i++) g.fillRect(tx+dir*i,sy-Math.round(i*0.75),2,2);
  }
  const cx=w/2, cy=h*0.36, rx=w*0.42, ry=h*0.28, cl=[];
  const n=9+Math.floor(r()*5);
  for(let i=0;i<n;i++){
    const a=r()*Math.PI*2, d=Math.sqrt(r());
    cl.push({x:cx+Math.cos(a)*rx*0.62*d, y:cy+Math.sin(a)*ry*0.62*d, r:w*(0.15+r()*0.1)});
  }
  cl.push({x:cx,y:cy,r:w*0.25});
  blobShade(g,w,h,cl,pal,sd,{rate:41,col:pal[pal.length-1]});
  return c;
}
function makeBlobSprite(sd,w,h,n,pal,speck){
  const [c,g]=mkCanvas(w,h);
  let s=sd>>>0; const r=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  const cl=[];
  for(let i=0;i<n;i++){
    const rr=h*(0.32+r()*0.2);
    cl.push({x:rr+r()*(w-2*rr), y:h-rr*0.85-r()*h*0.12, r:rr});
  }
  blobShade(g,w,h,cl,pal,sd,speck);
  return c;
}
function makeRockStack(sd,w,h,pal,levels){
  const [c,g]=mkCanvas(w,h);
  let s=sd>>>0; const r=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  const cl=[];
  let y=h, rad=w*0.32, cx=w/2;
  for(let l=0;l<levels;l++){
    const n=1+(r()<0.55?1:0)+(l===0?1:0);
    for(let k=0;k<n;k++){
      const rr=rad*(0.75+r()*0.35), sq=0.4+r()*0.2;
      const x=clamp(cx+(k-(n-1)/2)*rr*1.1+(r()-0.5)*rad*0.3, rr+1, w-rr-1);
      cl.push({x, y:y-rr*sq, r:rr, sq});
      const r2=rr*(0.45+r()*0.25);
      cl.push({x:clamp(x+(r()-0.5)*rr, r2+1, w-r2-1), y:y-rr*sq*1.6, r:r2, sq:sq*1.2});
    }
    y-=rad*(0.6+r()*0.25);
    rad*=0.74+r()*0.16;
    cx+=(r()-0.5)*rad*0.8;
    if(y<rad*0.5+2||rad<5) break;
  }
  blobShade(g,w,h,cl,pal,sd,null,0.06);
  return c;
}
function makeRockBand(bw,bh,sd,pal,minL,maxL,haze){
  const [c,g]=mkCanvas(bw,bh);
  let s=sd>>>0; const r=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  let x=0;
  while(x<bw-50){
    const fw=Math.round(50+r()*80), fh=Math.round(bh*(0.45+r()*0.55));
    const levels=minL+Math.floor(r()*(maxL-minL+1));
    if(x+fw<=bw) g.drawImage(makeRockStack(sd*7+x,fw,fh,pal,levels),x,bh-fh);
    x+=Math.round(fw*(0.55+r()*0.7));
  }
  if(haze){ g.globalCompositeOperation='source-atop'; g.fillStyle=haze; g.fillRect(0,0,bw,bh); g.globalCompositeOperation='source-over'; }
  return c;
}
function makeTreeBand(bw,bh,sd){
  const [c,g]=mkCanvas(bw,bh);
  let s=sd>>>0; const r=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  for(let x=0;x<bw;){
    const w=24+Math.floor(r()*18), h=Math.round(w*1.3+r()*10);
    if(x+w>bw) break;
    if(r()<0.6) g.drawImage(makeTree(sd+x,w,h,HAZY,HTRUNK),x,bh-h);
    x+=Math.round(w*(0.8+r()*0.9));
  }
  g.globalCompositeOperation='source-atop'; g.fillStyle='rgba(200,150,175,0.14)'; g.fillRect(0,0,bw,bh);
  return c;
}
function makeGroundBand(){
  const [c,g]=mkCanvas(W*T,BAND+6);
  const top=4;
  g.fillStyle='#3a2719'; g.fillRect(0,top,W*T,BAND);
  for(let row=0,y=top+2; y<top+BAND-2; row++){
    const sh=5+(hash(row,3)%3);
    let x=-(hash(row,5)%9);
    while(x<W*T){
      const sw=7+(hash(x,row,7)%7);
      const tone=hash(x,row,9)%3;
      g.fillStyle=['#6a4a32','#5d412c','#76533a'][tone]; g.fillRect(x+1,y,sw-2,sh-1); g.fillRect(x,y+1,sw,sh-3);
      g.fillStyle='#8c6845'; g.fillRect(x+1,y,sw-3,1);
      g.fillStyle='#46301f'; g.fillRect(x+1,y+sh-2,sw-2,1);
      x+=sw+1;
    }
    y+=sh;
  }
  g.fillStyle='#2a1c12'; g.fillRect(0,top+BAND-2,W*T,2);
  g.fillStyle='#2f4a2a'; g.fillRect(0,top,W*T,3);
  g.fillStyle='#5b8a3e'; g.fillRect(0,top,W*T,1);
  for(let x=0;x<W*T;x++){
    if(hash(x,1)%3===0){ g.fillStyle=hash(x,2)%2?'#6f9d48':'#4c7a36'; g.fillRect(x,top-1-(hash(x,4)%3),1,2+(hash(x,4)%3)); }
  }
  return c;
}

function makeHall(){
  const w=76,h=62; const [c,g]=mkCanvas(w,h);
  for(let y=h-12;y<h;y+=4) for(let x=((y/4)%2)*4;x<w;x+=8){ g.fillStyle=['#6b6f86','#5d6077','#777b92'][hash(x,y)%3]; g.fillRect(x+1,y,7,3); }
  g.fillStyle='#3a3c50'; g.fillRect(0,h-12,w,1);
  g.fillStyle='#8a6a48'; g.fillRect(4,h-36,w-8,24);
  for(let y=h-36;y<h-12;y+=3){ g.fillStyle='#6e5236'; g.fillRect(4,y,w-8,1); }
  g.fillStyle='#4a3424'; g.fillRect(4,h-36,2,24); g.fillRect(w-6,h-36,2,24); g.fillRect(w/2-1,h-36,2,24);
  g.fillStyle='#5a2a24'; for(let i=0;i<16;i++) g.fillRect(2+i*2,h-37-i,w-4-i*4,1);
  g.fillStyle='#8a3c30'; for(let i=1;i<15;i++) g.fillRect(4+i*2,h-37-i,w-8-i*4,1);
  for(let i=0;i<w;i+=4){ g.fillStyle='rgba(0,0,0,0.18)'; g.fillRect(i,h-52,1,15); }
  g.fillStyle='#8a6a48'; g.fillRect(w/2-6,h-58,12,8);
  g.fillStyle='#5a2a24'; g.fillRect(w/2-8,h-60,16,3);
  g.fillStyle='#2a2a2a'; g.fillRect(w/2,h-62,1,4);
  g.fillStyle='#2a1a10'; g.fillRect(w/2-6,h-24,12,12); g.fillStyle='#4a3020'; g.fillRect(w/2-5,h-23,10,11);

function flockOf(b){ return sheep.filter(s=>s.barn===b); }
function pastureFor(b){
  for(const side of [1,-1]){ const x=b.x+side*95; if(!buildings.some(o=>o!==b&&Math.abs(o.x-x)<o.w/2+30)) return x; }
  return b.x+95;
}
function stepSheep(s){
  const b=s.barn;
  if(!b||buildings.indexOf(b)<0){ s.dead=true; return; }
  if(s.state==='in'){
    s.x=b.x;
    if(b.out&&b.farmer&&Math.abs(b.farmer.x-b.x)<220){ s.state='out'; s.x=b.x+(rnd()-0.5)*10; s.wx=s.x; s.wait=Math.floor(rnd()*60); }
    return;
  }
  let goal, speed;
  if(b.out){ const px=b.pasture??(b.pasture=pastureFor(b)); if(--s.wait<=0){ s.wx=px+(rnd()-0.5)*80; s.wait=120+Math.floor(rnd()*240); } goal=s.wx; speed=s.adult?0.32:0.42; }
  else { goal=b.x; speed=0.55; if(Math.abs(s.x-b.x)<4){ s.state='in'; s.marked=false; return; } }
  const d=goal-s.x;
  if(Math.abs(d)>1){ s.face=Math.sign(d); s.x+=s.face*Math.min(speed,Math.abs(d)); s.walk+=speed*0.3; s.moving=true; } else s.moving=false;
}
function killSheep(s){
  s.dead=true; sheep=sheep.filter(q=>q!==s);
  spawnChips(s.x,GY*T-6,'#f0ece4',10); spawnChips(s.x,GY*T-4,'#8a7a6a',4);
  lootCoins(BAL.sheepCoins,s.x,GY*T-8,null);
}
const fieldL=m=>m.x-25, fieldR=m=>m.x+75;
function reapStep(p,m,barn){
  const L=fieldL(m), R=fieldR(m);
  if(!m.reaping){ moveToward(p,L,0.9); if(Math.abs(p.x-L)<3){ m.reaping=true; m.cutX=L; } return; }
  p.task='reap'; p.face=1; m.cutX+=0.3; p.x=m.cutX; p.vx=0.3; p.walk+=0.08;
  if(p.act>0) p.act--; else p.act=20;
  if(tick%8===0) spawnChips(m.cutX+4,GY*T-6,'#e0c060',1,0.05);
  if(m.cutX>=R){
    m.reaping=false; m.ripe=false; m.ordered=false; m.grow=0; m.harvester=null; p.reap=null; p.task='farm';
    const n=BAL.mill.coins[m.level||1];
    for(let i=0;i<n;i++) dropCoin(L+rnd()*(R-L),GY*T-10,(rnd()-0.5)*0.6,-1.5-rnd());
    sparkle((L+R)/2,GY*T-14,'#ffe08a',14);
  }
}
// фермер: утром выводит стадо на пастбище, вечером загоняет; закалывает отмеченную овцу; косит пшеницу
function stepFarmer(p){
  let barn=p.barn&&buildings.indexOf(p.barn)>=0?p.barn:null;
  if(!barn){ barn=buildings.find(b=>b.type==='barn'&&b.stage==='done'&&!b.farmer)||null; if(barn){ barn.farmer=p; p.barn=barn; } }
  // жатва: свободный фермер — всегда, фермер при амбаре — ночью, когда стадо загнано
  if(p.reap&&!(p.reap.ripe&&buildings.indexOf(p.reap)>=0)){ if(p.reap) { p.reap.harvester=null; p.reap.reaping=false; } p.reap=null; p.task='farm'; }
  if(!p.reap){
    const tt=dayClock%BAL.dayLen, day0=tt>=BAL.pasture[0]&&tt<BAL.pasture[1];
    if(!barn||(!day0&&flockOf(barn).every(q=>q.state==='in'))){
      const m=buildings.find(b=>b.type==='mill'&&b.stage==='done'&&b.ripe&&b.ordered&&!b.harvester);
      if(m){ m.harvester=p; p.reap=m; }
    }
  }
  if(p.reap){ if(barn) barn.out=false; reapStep(p,p.reap,barn); return; }
  let goal=null, speed=0.7;
  if(!barn){
    goal=pcx()-P.face*(30+p.idx*14); const d=Math.abs(goal-p.x); speed=d>60?1.5:0.9; if(d<6) goal=null;
    moveToward(p,goal,speed); return;
  }
  const t=dayClock%BAL.dayLen, daytime=t>=BAL.pasture[0]&&t<BAL.pasture[1];
  const target=flockOf(barn).find(q=>q.marked&&q.state!=='in');
  if(target){
    goal=target.x-(p.x<target.x?8:-8); speed=0.9;
    if(Math.abs(p.x-goal)<3){ p.face=target.x>p.x?1:-1; goal=null; if(p.act===0){ p.act=30; killSheep(target); } }
  } else if(daytime){
    barn.out=true;
    const px=barn.pasture??(barn.pasture=pastureFor(barn));
    if(--p.wait<=0||Math.abs(p.wx-px)>60){ p.wx=px+(rnd()-0.5)*50; p.wait=180+Math.floor(rnd()*200); }
    goal=p.wx; speed=Math.abs(p.wx-p.x)>80?0.9:0.4;
  } else { barn.out=false; goal=barn.x+14; speed=0.6; }
  moveToward(p,goal,speed);
}
function rabbitSpot(){
  const xs=trees.filter(t=>t.grow>=1).map(t=>t.x*T+4).sort((a,b)=>a-b);
  if(xs.length<2) return null;
  for(let k=0;k<12;k++){ const i=Math.floor(rnd()*(xs.length-1)), a=xs[i], b=xs[i+1]; if(b-a>=10&&b-a<240) return Math.round((a+b)/2); }
  return null;
}

const GAITS=['walk','trot','canter','gallop'];
const GW={walk:1,trot:0,canter:0,gallop:0}; let gaitName='walk';
function gp(k){ let v=0; for(const g of GAITS) v+=GW[g]*RGAIT[g][k]; return v; }
let moveBlend=0, liftBlend=0, landT=0, wasGround=true, turnT=0, idleT=0, actT=0;

function pxLine(x0,y0,x1,y1,w0,w1,col){
  ctx.fillStyle=col;
  const n=Math.max(1,Math.round(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));
  for(let i=0;i<=n;i++){
    const t=i/n, w=Math.round(w0+(w1-w0)*t);
    ctx.fillRect(Math.round(x0+(x1-x0)*t-w/2),Math.round(y0+(y1-y0)*t),w,1);
  }
}
function ik(hx,hy,fx,fy,l1,l2,side){
  const dx=fx-hx, dy=fy-hy;
  let d=Math.hypot(dx,dy);
  d=Math.min(Math.max(d,Math.abs(l1-l2)+0.01),l1+l2-0.01);
  const base=Math.atan2(dy,dx), a=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d)), ang=base+side*a;
  return [hx+Math.cos(ang)*l1, hy+Math.sin(ang)*l1];
}
function drawPart(k,dx,dy){ const m=RA[k]; ctx.drawImage(RIDER_IMG,m.sx,m.sy,m.w,m.h,m.ox+dx,m.oy+dy,m.w,m.h); }
// корпус в две половины: на галопе перед и зад качаются в противофазе
function drawBody(rearDy,frontDy){
  const m=RA.body, split=RCX-m.ox;
  ctx.drawImage(RIDER_IMG,m.sx,m.sy,split,m.h,m.ox,m.oy+rearDy,split,m.h);
  ctx.drawImage(RIDER_IMG,m.sx+split-1,m.sy,m.w-split+1,m.h,m.ox+split-1,m.oy+frontDy,m.w-split+1,m.h);
}

function legPose(u,stride,lift,duty){
  if(u<duty) return [stride-2*stride*u/duty, 0];
  const s=(u-duty)/(1-duty), e=s*s*(3-2*s);
  return [-stride+2*stride*e, Math.sin(Math.PI*s)*lift];
}
function drawLeg(i,leg,ph,dy,air,rest){
  const hx=leg.x, hy=HIPY+dy;
  let fx, fy, lifted=0;
  if(air){ fx=leg.x+(leg.front?4:-4); fy=HIPY+(leg.front?11:13)+dy; lifted=1; }
  else{
    let ox=0, oy=0;
    for(const k of GAITS){
      const w=GW[k]; if(w<0.001) continue;
      const g=RGAIT[k]; let u=(ph-g.ph[i])%1; if(u<0) u+=1;
      const pz=legPose(u,g.stride,g.lift,g.duty); ox+=w*pz[0]; oy+=w*pz[1];
    }
    fx=leg.x+ox*moveBlend;
    const lift=oy*liftBlend;
    fy=GROUND-lift; lifted=clamp(lift/4,0,1);
  }
  if(rest && !leg.front && !leg.far){ fx+=1; fy-=1.5; lifted=0.5; }
  let fetX=fx+(leg.front?(-1+lifted*3):(-1+lifted*2));
  let fetY=fy-3+lifted;
  const l1=leg.front?9.0:9.4, l2=leg.front?8.0:8.2;
  const ddx=fetX-hx, ddy=fetY-hy, dd=Math.hypot(ddx,ddy), reach=(l1+l2)*0.97;
  if(dd>reach){ const k=reach/dd, nx=hx+ddx*k, ny=hy+ddy*k; fx+=nx-fetX; fy+=ny-fetY; fetX=nx; fetY=ny; }
  const [kx,ky]=ik(hx,hy,fetX,fetY,l1,l2,leg.front?-1:1);
  const col=leg.far?'#0a090c':'#18161c', hi='#2c2834';
  pxLine(hx,hy,kx,ky,leg.front?4:5,3,col);
  pxLine(kx,ky,fetX,fetY,2,2,col);
  pxLine(fetX,fetY,fx,fy-1,2,2,col);
  if(!leg.far){ pxLine(hx+1,hy+1,kx+1,ky,1,1,hi); pxLine(kx+1,ky+1,fetX+1,fetY-1,1,1,hi); }
  const hfx=Math.round(fx)-1, hfy=Math.round(fy)-1;
  ctx.fillStyle='#050406'; ctx.fillRect(hfx,hfy,3,2);
  ctx.fillStyle=leg.far?'#141218':'#3a3440'; ctx.fillRect(hfx+2,hfy,1,1);
}
function gaitWave(ph,key,beatsKey,lag=0){
  let v=0; for(const g of GAITS){ const G=RGAIT[g]; v+=GW[g]*G[key]*Math.abs(Math.sin(Math.PI*2*(ph-lag)*G[beatsKey])); } return v;
}
function drawRider(sx,feet,face,ph,t,onGround,spd){
  if(!RIDER_IMG.complete||!RIDER_IMG.naturalWidth) return;
  const air=!onGround;
  const dip=landT>0?Math.round(landT/4):0;
  const bob=air?0:gaitWave(ph,'bob','beats')*moveBlend;
  const bodyDy=-Math.round(bob)+dip;

  const frontDy=bodyDy-pitch, rearDy=bodyDy+pitch;

  const breath=(moveBlend<0.2&&Math.sin(t*1.3)>0.55)?-1:0;
  const act=actT>4?1:0;
  const riderDy=-Math.round(lagBob)+dip+breath+act;
  let nod=0; for(const g of GAITS){ const G=RGAIT[g]; nod+=GW[g]*G.nod*Math.sin(Math.PI*2*ph*G.nbeats+0.6); }

  const graze=(moveBlend<0.2&&actT===0&&Math.sin(t*0.45)>0.85)?1:0;
  const headDy=frontDy+nod+graze+(air?-1:0);
  const rest=idleT>150&&actT===0;
  const main=ctx; ctx=rbctx;

function lockOf(k,b){

  if(k==='wall'){ const n=walls.level+1; return n>H?{by:'hall',lv:n}:null; }
  if(k!=='upgrade'&&k.endsWith('up')){
    const r=BAL.req[k.slice(0,-2)]||{}, n=((b&&b.level)||1)+1, need=(r.up&&r.up[n])??n;
    return need>H?{by:'hall',lv:need}:null;
  }
  const r=BAL.req[k]; if(!r) return null;
  if(r.build&&r.build>H) return {by:'hall',lv:r.build};
  if(k==='tower'&&buildings.filter(o=>o.type==='tower').length>=H) return {by:'hall',lv:H+1};   // башен не больше уровня ратуши

  if(x-w/2<40*T||x+w/2>(W-40)*T) return false;
  for(const c of CAMPS) if(Math.abs(c.x*T-x)<120) return false;
  const h=hall();
  if(Math.abs(x-h.x)+w/2>BAL.hallRadius[h.level]-12) return false;
  for(const b of buildings){
    if(b.type.endsWith('up')) continue;
    if(Math.abs(b.x-x)-(b.w+w)/2<10) return false;
  }
  for(const t of trees) if(Math.abs(t.x*T+4-x)<w/2+6) return false;
  return true;
}
let bOpenKind='';

// ================= монеты =================
function spawnChips(x,y,col,n=4,g=0.12){ for(let i=0;i<n;i++) parts.push({x,y,vx:(rnd()-.5)*1.4,vy:-rnd()*1.6-0.2,life:20+rnd()*10,col,g}); }
function sparkle(x,y,col='#ffe08a',n=10){ for(let i=0;i<n;i++) parts.push({x,y,vx:(rnd()-.5)*1.4,vy:-rnd()*1.4-0.3,life:30+rnd()*12,col,g:0.04}); }
const hall=()=>buildings[0];
function handX(){ return pcx()+P.face*6; }
function handY(){ return P.y+P.h-48; }
function incomingPurse(){ return coins.filter(c=>c.flight&&c.flight.target.type==='purse').length; }
function coinToPlayer(x,y){
  if(purse+incomingPurse()<COIN_MAX) coins.push({x,y,vx:0,vy:0,ground:false,age:0,flight:{sx:x,sy:y,tx:pcx(),ty:handY(),t:0,dur:20,target:{type:'purse'}}});
  else dropCoin(x,y,(rnd()-0.5),-1.5);
}
function dropCoin(x,y,vx,vy,bounty=true){ coins.push({x,y,vx,vy,ground:false,age:0,flight:null,bounty,claim:null}); }
function throwCoin(){
  if(purse<=0){ actT=6; return; }
  const hx=pcx(), h=hall();
  let target=null;
  if(h.stage==='done'&&Math.abs(h.x-hx)<46) target={type:'hall'};
  else if(h.stage==='stone'&&Math.abs(h.x-hx)<46) target={type:'site'};
  if(!target&&people.some(q=>q.state==='farmer')){
    const m=buildings.find(b=>b.type==='mill'&&b.stage==='done'&&b.ripe&&!b.ordered&&hx>fieldL(b)-12&&hx<fieldR(b)+12);
    if(m) target={type:'field',mill:m};
  }
  if(!target&&people.some(q=>q.state==='farmer'&&q.barn)){
    let best=null,bd=26;
    for(const q of sheep){ if(!q.adult||q.marked||q.state==='in'||!q.barn.farmer) continue; if(flockOf(q.barn).length<BAL.sheepMin) continue; const d=Math.abs(q.x-hx); if(d<bd){bd=d;best=q;} }
    if(best) target={type:'sheep',sheep:best};
  }
  if(target){}
  else if(people.some(q=>q.state==='worker'||q.state==='carpenter')){
    let best=null,bd=28;
    for(const tr of trees){ if(tr.marked||tr.grow<1) continue; const d=Math.abs(tr.x*T+4-hx); if(d<bd){bd=d;best=tr;} }
    if(best) target={type:'tree',tree:best};
  }
  purse--; actT=8;
  const c={x:handX(),y:handY(),vx:0,vy:0,ground:false,age:0,flight:null};
  if(target){
    const tx=target.type==='tree'?target.tree.x*T+4:target.type==='sheep'?target.sheep.x:target.type==='field'?(fieldL(target.mill)+fieldR(target.mill))/2:h.x;
    const ty=target.type==='tree'?GY*T-40:target.type==='sheep'?GY*T-10:target.type==='field'?GY*T-12:GY*T-(target.type==='hall'?30:20);
    c.flight={sx:c.x,sy:c.y,tx,ty,t:0,dur:26,target};
    if(target.type==='tree') target.tree.marked=true;
    if(target.type==='sheep') target.sheep.marked=true;
    if(target.type==='field') target.mill.ordered=true;
  } else { c.vx=P.face*1.1+P.vx*0.6; c.vy=-2.2; }
  coins.push(c);
}
function takeCoin(){
  const h=hall();
  if(h.stage!=='done'||h.bank<=0||purse+incomingPurse()>=COIN_MAX) return;
  if(Math.abs(h.x-pcx())>46) return;
  h.bank--;
  coins.push({x:h.x,y:GY*T-30,vx:0,vy:0,ground:false,age:0,flight:{sx:h.x,sy:GY*T-30,tx:pcx(),ty:handY(),t:0,dur:22,target:{type:'purse'}}});
}
function coinArrive(c){
  const tg=c.flight.target, h=hall();
  if(tg.type==='tree'||tg.type==='sheep'||tg.type==='field') sparkle(c.x,c.y,'#ffe08a',6);
  else if(tg.type==='site'){ h.coins++; sparkle(c.x,c.y,'#ffe08a',8); if(h.coins>=BAL.hall.siteCoins){ h.stage='blueprint'; h.glow=60; sparkle(h.x,GY*T-30,'#bfe0ff',24); } }
  else if(tg.type==='hall'){ h.bank++; sparkle(c.x,c.y,'#ffe08a',8); }
  else if(tg.type==='purse'){ purse=Math.min(COIN_MAX,purse+1); }
  else if(tg.type==='pouch'){ const a=tg.a; if(people.indexOf(a)>=0&&a.pouch<(a.tower?BAL.tower.lv[a.tower.level||1].pouch:BAL.archer.pouch)) a.pouch++; else dropCoin(c.x,c.y,(rnd()-0.5)*0.6,-0.5); }
  c.dead=true;
}
function updCoins(){
  for(const c of coins){
    c.age++;
    if(!c.flight) c.x=clamp(c.x,12,W*T-12);
    if(c.flight){
      const f=c.flight; f.t++;
      if(f.target.type==='purse'){ f.tx=pcx(); f.ty=handY(); }
      const k=Math.min(1,f.t/f.dur);
      c.x=f.sx+(f.tx-f.sx)*k; c.y=f.sy+(f.ty-f.sy)*k-Math.sin(Math.PI*k)*22;
      if(k>=1) coinArrive(c);
      continue;
    }
    if(!c.ground){
      c.vy+=0.18; c.x+=c.vx; c.y+=c.vy;
      if(c.y>=GY*T-2){ c.y=GY*T-2; if(Math.abs(c.vy)>1){ c.vy*=-0.35; c.vx*=0.6; } else { c.ground=true; c.vx=0; c.vy=0; } }
    }
    if(c.ground||c.y>GY*T-10){
      for(const p of people){ if(p.state!=='vagrant') continue; if(Math.abs(p.x-c.x)<14){ hire(p); c.dead=true; break; } }
    }
    if(!c.dead&&c.ground&&c.age>90&&purse<COIN_MAX&&Math.abs(c.x-pcx())<10){ purse++; c.dead=true; sparkle(c.x,c.y-4,'#ffe08a',4); }
  }
  coins=coins.filter(c=>!c.dead);
}

// ================= люди =================
function hire(p){ p.state='worker'; p.task='follow'; p.shirt='#3f6d9a'; p.wait=0; sparkle(p.x,GY*T-20,'#ffe08a',12); }
function freeLogsNear(x,max,cap){
  const res=[];
  const sorted=logs.filter(l=>!l.taken).sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x));
  if(!sorted.length) return res;
  const first=sorted[0]; res.push(first);
  for(const l of sorted){ if(res.length>=cap) break; if(l!==first&&Math.abs(l.x-first.x)<40) res.push(l); }
  return res.slice(0,max);
}
function chooseTask(p){
  const R=BAL.role[p.state];
  // 1) леса для заказанной постройки
  const ord=buildings.find(b=>b.stage==='order'&&!b.scaffolder);
  if(ord){ ord.scaffolder=p; p.dest=ord; p.task='scaffold'; p.sub='toHall'; return; }
  // 2) брёвна на чертёж
  for(const b of buildings){
    if(b.stage!=='blueprint') continue;
    const left=b.need-b.wood-b.incoming; if(left<=0) continue;
    const res=freeLogsNear(p.x,left,R.logs);
    if(res.length){ for(const l of res) l.taken=p; p.logRes=res; b.incoming+=res.length; p.dest=b; p.task='fetch'; return; }
  }
  // 3) заказанное дерево
  const free=trees.find(t=>t.marked&&!t.worker);
  if(free){ free.worker=p; p.tree=free; p.task='chop'; return; }
  // 4) стройка
  const bb=buildings.find(b=>b.stage==='building'&&!isTimed(b));
  if(bb){ p.dest=bb; p.task='build'; return; }
  if(p.state==='worker'){
    // 5) монеты с добычи — по одной
    const bc=coins.find(c=>c.bounty&&c.ground&&!c.claim&&Math.abs(c.x-p.x)<200);
    if(bc){ bc.claim=p; p.coinT=bc; p.task='collect'; return; }
    // 6) охота (плохо получается)
    let prey=null,bd=150;
    for(const r of rabbits){ if(r.dead||r.hunter||r.ignoreT>0) continue; const d=Math.abs(r.x-p.x); if(d<bd&&Math.abs(r.x-pcx())<230){bd=d;prey=r;} }
    if(prey){ prey.hunter=p; p.prey=prey; p.task='hunt'; p.huntT=0; return; }
  }
}
function abortTask(p){
  if(p.coinT){ p.coinT.claim=null; p.coinT=null; }
  const owed=(p.logRes?p.logRes.length:0)+(p.logs||0);
  if(p.dest&&owed&&p.dest.incoming) p.dest.incoming=Math.max(0,p.dest.incoming-owed);
  for(const l of p.logRes||[]) l.taken=null; p.logRes=[];
  for(let i=0;i<(p.logs||0);i++) logs.push({x:clamp(p.x+i*6,12,W*T-12),taken:null}); p.logs=0;
  if(p.dest&&p.dest.scaffolder===p) p.dest.scaffolder=null; p.scaff=false;
  if(p.prey){ p.prey.hunter=null; p.prey.ignoreT=1200; p.prey=null; }
  if(p.task==='bring'&&p.coin>0){ dropCoin(p.x,GY*T-14,0,-1.2); p.coin=0; p.thief=false; }
  p.task='follow'; p.taskT=0;
}
function stepWorker(p){
  const R=BAL.role[p.state];
  if(p.scaff&&p.task!=='scaffold') p.scaff=false;                  // леса в руках только у того, кто их несёт
  if(p.task!==p.lastTask){ p.lastTask=p.task; p.taskT=0; } else p.taskT=(p.taskT||0)+1;
  if(p.taskT>1800&&['collect','fetch','deliver','scaffold','hunt','bring'].includes(p.task)) abortTask(p);
  let goal=null, speed=R.walk;
  if(p.task==='follow') chooseTask(p);
  switch(p.task){
    case 'train':{
      const b=p.dest; goal=b.x;
      if(Math.abs(p.x-goal)<3){ goal=null; p.trainT++;
        if(p.trainT>=BAL.trainTicks){ p.state=p.trainTo; p.task=p.state==='archer'?'roam':p.state==='farmer'?'farm':p.state==='fisher'?'fish':'follow'; p.shirt={archer:'#3f6a3a',carpenter:'#8a5a2a',farmer:'#9a8a4a',fisher:'#3a6a8a'}[p.state]; sparkle(p.x,GY*T-20,'#bfe0ff',14); p.trainTo=null; } }
      break;
    }
    case 'scaffold':{
      const b=p.dest;
      if(!b||b.stage!=='order'){ p.task='follow'; p.scaff=false; break; }
      if(p.sub==='toHall'){ goal=hall().x; if(Math.abs(p.x-goal)<3){ p.scaff=true; p.sub='toSite'; } }
      else{ goal=b.x; speed=R.carry; if(Math.abs(p.x-goal)<3){ p.scaff=false; b.stage='blueprint'; b.scaffolder=null; b.glow=40; sparkle(b.x,GY*T-20,'#bfe0ff',14); p.task='follow'; } }
      break;
    }
    case 'fetch':{
      const next=p.logRes.find(l=>logs.indexOf(l)>=0);
      if(!next){
        if(p.logs>0){ p.task='deliver'; }
        else { if(p.dest) p.dest.incoming=Math.max(0,p.dest.incoming-p.logRes.length); p.logRes=[]; p.task='follow'; }
        break;
      }
      goal=next.x; speed=p.logs?R.carry:R.walk;
      if(Math.abs(p.x-goal)<3){ logs.splice(logs.indexOf(next),1); p.logs++; p.logRes=p.logRes.filter(l=>l!==next); if(!p.logRes.length) p.task='deliver'; }
      break;
    }
    case 'deliver':{
      const b=p.dest;
      if(!b||b.stage!=='blueprint'){ for(let i=0;i<p.logs;i++) logs.push({x:p.x+i*6,taken:null}); if(b) b.incoming=Math.max(0,b.incoming-p.logs); p.logs=0; p.task='follow'; break; }
      goal=b.x+(p.idx%3-1)*10; speed=R.carry;
      if(Math.abs(p.x-goal)<3){ b.wood+=p.logs; b.incoming=Math.max(0,b.incoming-p.logs); spawnChips(b.x,GY*T-6,'#8a5e38',4*p.logs); p.logs=0; p.task='follow';
        if(b.wood>=b.need) b.stage='building'; }
      break;
    }
    case 'chop':{
      const tr=p.tree;
      if(!tr||trees.indexOf(tr)<0){ p.task='follow'; p.tree=null; break; }
      goal=tr.x*T+4-(p.x<tr.x*T+4?10:-10);
      if(Math.abs(p.x-goal)<2){ goal=null; p.face=tr.x*T+4>p.x?1:-1;
        if(p.act===0){ p.act=R.chop; tr.hp--; tr.sh=8; spawnChips(tr.x*T+4,GY*T-12,'#7a5638',4); if(tr.hp<=0) fellTree(tr,p); } }
      break;
    }
    case 'build':{
      const b=p.dest;
      if(!b||b.stage!=='building'){ p.task='follow'; break; }
      goal=b.x+(p.idx%4-1.5)*Math.min(14,b.w/4);
      if(Math.abs(p.x-goal)<2){ goal=null; p.face=b.x>p.x?1:-1;
        if(p.act===0){ p.act=24; spawnChips(b.x+(rnd()-0.5)*b.w*0.5,GY*T-10-rnd()*30,'#c9a46a',2); }
        if(!isTimed(b)) b.progress+=R.build;
        if(b.progress>=1) finishBuilding(b); }
      break;
    }
    case 'collect':{
      const c=p.coinT;
      if(!c||coins.indexOf(c)<0){ p.coinT=null; p.task='follow'; break; }
      goal=c.x; speed=1.0;
      if(c.ground&&Math.abs(p.x-c.x)<6){ coins.splice(coins.indexOf(c),1); p.coinT=null; takeCoinFor(p); }
      break;
    }
    case 'bring':{
      if(!(p.coin>0)){ p.task='follow'; break; }
      if(p.thief){ if(--p.stealT<=0) steal(p); }
      if(p.coin<=0) break;
      goal=pcx()-P.face*12; speed=Math.abs(goal-p.x)>60?1.4:1.0;
      if(Math.abs(p.x-pcx())<18){ goal=null; p.coin=0; coinToPlayer(p.x,GY*T-22); p.task='follow'; }
      break;
    }
    case 'hunt':{
      const r=p.prey;
      p.huntT=(p.huntT||0)+1;
      if(!r||r.dead||Math.abs(r.x-pcx())>320||p.huntT>BAL.huntTimeout){ if(r){ r.hunter=null; if(p.huntT>BAL.huntTimeout) r.ignoreT=1200; } p.prey=null; p.task='follow'; break; }
      goal=r.x; speed=R.hunt;
      if(Math.abs(p.x-r.x)<8&&r.y>-7){ p.act=20; p.face=r.x>p.x?1:-1; killRabbit(r,null); p.prey=null; p.task='follow'; goal=null; }
      break;
    }
  }
  if(p.task==='follow'&&goal===null){
    goal=pcx()-P.face*(34+p.idx*14);
    const d=Math.abs(goal-p.x);
    speed=d>60?1.5:d>20?0.9:0.5;
    if(d<6) goal=null;
  }
  moveToward(p,goal,speed);
}
// рабочий взял монету: может украсть (20%), а лучник рядом это видит
function takeCoinFor(p){
  if(p.prey){ p.prey.hunter=null; p.prey=null; }
  p.coin=1; p.task='bring';
  if(p.state==='worker'&&rnd()<BAL.stealChance){ p.thief=true; p.stealT=40+Math.floor(rnd()*60); }
}
function steal(p){
  p.thief=false; p.coin=0; p.stolen++;
  sparkle(p.x,GY*T-24,'#b07ad0',6);
  let seer=null,bd=BAL.archerSight;
  for(const a of people){ if(a.state!=='archer') continue; const d=Math.hypot(a.x-p.x,(a.tower?40:0)); if(d<bd){bd=d;seer=a;} }
  if(seer){ seer.reload=0; shoot(seer,{kind:'worker',ref:p}); }
  p.task='follow';
}
function moveToward(p,goal,speed){
  if(goal!==null&&Math.abs(goal-p.x)>1){ const dir=Math.sign(goal-p.x); p.face=dir; p.vx+=(dir*speed-p.vx)*0.15; }
  else p.vx*=0.7;
  p.x=clamp(p.x+p.vx,4,W*T-4);
  if(Math.abs(p.vx)>0.05) p.walk+=Math.abs(p.vx)*0.25;
  if(p.act>0) p.act--;
}
// ---- лучник: сам ходит по карте и охотится, монеты держит у себя (до 3) ----
function archerTop(a){ return a.tower?GY*T-56:GY*T-14; }
function stepArcher(a){
  if(a.reload>0) a.reload--;
  if(a.act>0) a.act--;
  if(a.tower){
    a.x=a.tower.x; a.vx=0;
    if(a.pouch>0&&Math.abs(pcx()-a.x)<26){ while(a.pouch>0){ a.pouch--; coinToPlayer(a.x,GY*T-56); } }
    const TL=BAL.tower.lv[a.tower.level||1];
    const tgt=findTarget(a,TL.range,true);
    if(tgt&&a.reload===0){ a.face=tgt.x>a.x?1:-1; shoot(a,tgt); a.reload=TL.reload; }
    return;
  }
  // свободная башня — забраться
  const tw=buildings.find(b=>b.type==='tower'&&b.stage==='done'&&!b.archer);
  if(tw){ tw.archer=a; a.task='toTower'; a.dest=tw; }
  if(a.task==='toTower'){
    const b=a.dest; if(!b||b.archer!==a){ a.task='roam'; }
    else { moveToward(a,b.x,BAL.archer.speed); if(Math.abs(a.x-b.x)<3){ a.tower=b; a.task='tower'; sparkle(a.x,GY*T-50,'#bfe0ff',8); } return; }
  }
  // отдать монеты всаднику, проезжающему мимо
  if(a.pouch>0&&Math.abs(pcx()-a.x)<22){ while(a.pouch>0){ a.pouch--; coinToPlayer(a.x,GY*T-20); } }
  // или рабочему, который пробегает мимо по своим делам
  if(a.pouch>0){
    for(const w of people){ if(w.state!=='worker'||w.coin>0||(w.task!=='follow'&&w.task!=='hunt')) continue; if(Math.abs(w.x-a.x)<12&&Math.abs(w.vx)>0.2){ a.pouch--; takeCoinFor(w); break; } }
  }
  let goal=null, speed=BAL.archer.speed;
  // подобрать монеты с добычи, пока есть место
  if(a.coinWait>0) a.coinWait--;
  if(a.pouch<BAL.archer.pouch&&!(a.coinWait>0)){
    const c=coins.find(k=>k.bounty&&k.ground&&(!k.claim||k.claim===a)&&Math.abs(k.x-a.x)<90);
    if(c&&c.claim===a){ c.claimT=(c.claimT||0)+1; if(c.claimT>900){ c.claim=null; c.claimT=0; a.coinWait=600; } }
    if(c){ c.claim=a; goal=c.x; if(Math.abs(a.x-c.x)<6){ coins.splice(coins.indexOf(c),1); archerGain(a); goal=null; } }
  }
  if(goal===null){
    // своя добыча: ближайший кролик на всей карте, за которым не идёт другой лучник
    let prey=a.preyR&&!a.preyR.dead&&rabbits.indexOf(a.preyR)>=0&&Math.abs(a.preyR.x-a.x)<BAL.archer.sight*1.5?a.preyR:null;
    if(!prey){
      if(a.preyR&&a.preyR.archer===a) a.preyR.archer=null;
      a.preyR=null;
      let bd=BAL.archer.sight;                        // видит только в пределах поля зрения
      for(const r of rabbits){ if(r.dead||(r.archer&&r.archer!==a&&people.indexOf(r.archer)>=0)) continue; const d=Math.abs(r.x-a.x); if(d<bd){bd=d;prey=r;} }
      if(prey){ prey.archer=a; a.preyR=prey; }
    }
    if(prey){
      const d=prey.x-a.x;
      if(Math.abs(d)>BAL.archer.range-10){ goal=prey.x-Math.sign(d)*(BAL.archer.range-24); speed=Math.abs(d)>200?1.0:0.8; }
      else if(a.reload===0){ a.face=Math.sign(d)||1; shoot(a,{kind:'rabbit',ref:prey,x:prey.x}); }
    } else {
      // никого не видно — патрулирует всю карту из конца в конец
      const lo=30*T, hi=(W-30)*T;
      if(!a.pdir) a.pdir=rnd()<0.5?-1:1;
      if(a.x<=lo+4) a.pdir=1; else if(a.x>=hi-4) a.pdir=-1;
      goal=a.pdir>0?hi:lo; speed=0.6;
    }
  }
  moveToward(a,goal,speed);
}
// зарплата лучника — каждая вторая монета
function archerGain(a){ a.wageT^=1; if(a.wageT===1){ a.wage++; sparkle(a.x,GY*T-24,'#e8c050',3); } else a.pouch++; }
function findTarget(a,range,birdsToo){

  if(birdsToo) for(const b of birds){ if(b.dead) continue; const d=Math.hypot(b.x-a.x,b.y-ay); if(d<bd){bd=d;best={kind:'bird',ref:b,x:b.x};} }

function shoot(a,tgt){

  const r=tgt.ref;
  const tx=tgt.kind==='bird'?r.x+r.vx*20:(tgt.kind==='worker'?r.x:r.x), ty=tgt.kind==='bird'?r.y:GY*T-4-(tgt.kind==='worker'?10:0);
  const dist=Math.hypot(tx-sx,ty-sy);
  arrows.push({sx,sy,tx,ty,x:sx,y:sy,t:0,dur:Math.max(10,dist/3.2),tgt,shooter:a,arc:Math.min(18,dist*0.12)});
  a.reload=BAL.archer.reload; a.act=12;
}
function updArrows(){
  for(const ar of arrows){
    ar.t++; const k=ar.t/ar.dur;
    ar.px=ar.x; ar.py=ar.y;
    ar.x=lerp(ar.sx,ar.tx,k); ar.y=lerp(ar.sy,ar.ty,k)-Math.sin(Math.PI*k)*ar.arc;
    if(k>=1){
      ar.dead=true;
      const t=ar.tgt, r=t.ref;
      if(t.kind==='rabbit'&&!r.dead&&Math.abs(r.x-ar.tx)<8) killRabbit(r,ar.shooter);

// добыча лучника в башне: монеты падают вниз, каждую вторую он забирает себе

function killRabbit(r,shooter){

function stepRabbit(r){
  if(r.ignoreT>0) r.ignoreT--;

  const dh=pcx()-r.x; if(Math.abs(dh)<46) th=dh;
  if(r.hunter){ const d=r.hunter.x-r.x; if(Math.abs(d)<40&&(th===null||Math.abs(d)<Math.abs(th))) th=d; }
  if(r.y===0&&r.vy===0){
    if(r.rest>0) r.rest--;
    else if(th!==null){ r.face=th>0?-1:1; if((r.x<60&&r.face<0)||(r.x>W*T-60&&r.face>0)) r.face=-r.face;   // у края проскакивает мимо
      r.vx=r.face*(1.15+rnd()*0.25); r.vy=-1.7; r.y=-0.01; }
    else if(--r.wait<=0){ r.face=r.x<80?1:r.x>W*T-80?-1:(rnd()<0.7?r.face:-r.face); r.vx=r.face*0.55; r.vy=-1.1; r.y=-0.01; r.wait=40+Math.floor(rnd()*140); }
  } else {
    r.vy+=0.15; r.y+=r.vy; r.x+=r.vx;
    if(r.y>=0){ r.y=0; r.vy=0; r.vx=0; r.rest=th!==null?9:0; }
  }
  if(r.x<8||r.x>W*T-8){ r.x=clamp(r.x,8,W*T-8); r.home=r.x; }
}
function fellTree(tr,p){

  stumps.push(tr.x);
  fallen.push({x:tr.x,v:tr.v,t:0,dir:p.x<tr.x*T+4?1:-1});
  p.task='follow'; p.tree=null;
  for(let i=0;i<2;i++) logs.push({x:tr.x*T+4+(i?14:-6)*(p.x<tr.x*T+4?1:-1),taken:null});
  if(rnd()<BAL.treeCoinChance) dropCoin(tr.x*T+4,GY*T-30,(rnd()-0.5)*0.8,-1.5,false);
}
function stepFisher(a){
  if(a.act>0) a.act--;
  if(a.fishAnim>0) a.fishAnim--;
  if(a.pouch>0&&Math.abs(pcx()-a.x)<22){ while(a.pouch>0){ a.pouch--; coinToPlayer(a.x,GY*T-20); } }
  if(a.fstate!=='fish'){
    if(a.spot==null) a.spot=40*T+rnd()*((W-80)*T);
    moveToward(a,a.spot,0.8);
    if(Math.abs(a.x-a.spot)<3){ a.fstate='fish'; a.fishT=0; a.left=2+Math.floor(rnd()*3); a.face=rnd()<0.5?-1:1; a.bite=0; }
    return;
  }

  if(a.bite>0){ a.bite--; if(a.bite===0) fishCaught(a); return; }
  // клёв: сразу после заброса 1%, каждую секунду ожидания +1%, не больше 90%
  if(a.fishT%60===0){ const ch=Math.min(BAL.fisher.max,BAL.fisher.start+BAL.fisher.step*(a.fishT/60-1)); if(rnd()<ch) a.bite=36; }
}
function fishCaught(a){
  a.fishAnim=30; a.act=12;
  a.wageT^=1;

}
function stepVagrant(p){

// ---- птицы ----
let nextBird=300;
function stepBirds(){

// ---- сутки ----
function darkness(){ return darkAt(dayClock%BAL.dayLen); }
function darkAt(t){
  const d=t<BAL.darkLen?t/BAL.darkLen:1-(t-BAL.darkLen)/(BAL.dayLen-BAL.darkLen);
  return d*d*(3-2*d);
}
function newDay(){
  dayNum++;
  // одно дерево на месте срубленного
  // лес: по 2 дерева в сутки на месте срубленных; если деревьев меньше 20 — подсадка на свободные места
  for(let k=0;k<BAL.treesPerDay&&stumps.length;k++){ const si=Math.floor(rnd()*stumps.length), x=stumps.splice(si,1)[0]; const t=newTree(x); t.grow=0; trees.push(t); }
  if(trees.length<BAL.forestMin){
    for(let k=0,tries=0;k<BAL.forestRefill&&tries<60;tries++){
      const f=FOREST[Math.floor(rnd()*FOREST.length)], x=f[0]+Math.floor(rnd()*(f[1]-f[0]));
      if(trees.some(t=>Math.abs(t.x-x)<4)||buildings.some(b=>Math.abs(b.x-(x*T+4))<b.w/2+12)) continue;
      const t=newTree(x); t.grow=0; trees.push(t); k++;
    }
  }
  // кролики до максимума
  // ягнята: раз в 10 суток по одному на пару взрослых; растут трое суток
  for(const s of sheep) if(!s.adult&&dayNum-s.born>=BAL.lambGrow) s.adult=true;
  if(dayNum%BAL.lambEvery===0) for(const b of buildings){
    if(b.type!=='barn'||b.stage!=='done') continue;
    const fl=flockOf(b), pairs=Math.floor(fl.filter(q=>q.adult).length/2);
    for(let i=0;i<pairs&&flockOf(b).length<BAL.barn.cap[b.level||1];i++) addSheep(b,false);
  }
  // бродяги раз в пять суток, не больше трёх в лагере
  if(dayNum%BAL.vagrantEvery===0) for(const c of CAMPS){ const n=people.filter(p=>p.state==='vagrant'&&p.camp===c).length; if(n<BAL.vagrantMax) people.push(newPerson(c.x*T+(rnd()-0.5)*30,c)); }
}

// ================= шаг физики =================
let camX=clamp(pcx()-VW/2,0,W*T-VW);
let prevJump=false, jumpBuf=0;
function speedTarget(){
  let m=0, dir=0;
  const sdx=stick.dx;
  if(Math.abs(sdx)>0.12){ m=(Math.abs(sdx)-0.12)/0.88; dir=Math.sign(sdx); }
  if(held('ArrowLeft','KeyA')){ dir=-1; m=held('ShiftLeft','ShiftRight')?1:0.62; }
  if(held('ArrowRight','KeyD')){ dir=1; m=held('ShiftLeft','ShiftRight')?1:0.62; }
  return dir*1.4*Math.pow(clamp(m,0,1),1.5);
}
function isTimed(b){ return b.type.endsWith('up'); }
function upKey(b){ return b.type==='hallup'?['hall',hall().level+1]:b.type==='wallup'?['wall',b.lvl]:[b.of.type,(b.of.level||1)+1]; }
// прокачки идут по настоящим часам: старт — когда собраны все брёвна
function tickTimers(){
  const now=Date.now();
  for(const b of buildings.slice()){
    if(b.stage!=='building'||!isTimed(b)) continue;
    if(!b.t0){ const [k,lv]=upKey(b); b.t0=now; b.tDur=(BAL.upTime[k]&&BAL.upTime[k][lv])||60e3; }
    b.progress=Math.min(1,(now-b.t0)/b.tDur);
    if(b.progress>=1) finishBuilding(b);
  }
}
function finishBuilding(b){
  b.progress=1; b.stage='done'; sparkle(b.x,GY*T-40,'#ffe08a',30); for(const w of people) if(w.task==='build'&&w.dest===b) w.task='follow';
  if(b.type==='hall'&&walls.level<1) setWallLevel(1);
  if(b.type==='wallup'){
    buildings.splice(buildings.indexOf(b),1);
    if(!buildings.some(o=>o.type==='wallup'&&o.lvl===b.lvl)){ setWallLevel(b.lvl); sparkle(wallX(-1),GY*T-30,'#bfe0ff',20); sparkle(wallX(1),GY*T-30,'#bfe0ff',20); }
  }
  else if(b.type==='hallup'){ hall().level++; buildings.splice(buildings.indexOf(b),1); sparkle(b.x,GY*T-60,'#bfe0ff',30); }
  else if(b.type.endsWith('up')){ b.of.level=(b.of.level||1)+1; buildings.splice(buildings.indexOf(b),1); sparkle(b.of.type==='mill'?b.x-53:b.x,GY*T-40,'#bfe0ff',24); }
  else if(b.type==='barn'){ addSheep(b,true); addSheep(b,true); }
}
function stepPhysics(){
  if(tick%30===0) tickTimers();
  tick++;
  dayClock+=1/60;
  if(Math.floor(dayClock/BAL.dayLen)>dayNum) newDay();
  const target=speedTarget();
  if(Math.abs(target)>0.05){ const f=Math.sign(target); if(f!==P.face){ P.face=f; turnT=6; } }
  if(turnT>0) turnT--;
  let rate=P.onGround?(target?0.06:0.08):0.05;
  if(!P.onGround&&Math.sign(target)===Math.sign(P.vx)&&Math.abs(target)<Math.abs(P.vx)) rate=0;
  P.vx+=(target-P.vx)*rate;
  if(!target&&Math.abs(P.vx)<0.03) P.vx=0;
  moveX(P.vx);
  const v=Math.abs(P.vx);
  if(gaitName==='walk'&&v>0.44) gaitName='trot';
  else if(gaitName==='trot'&&v>0.8) gaitName='canter';
  else if(gaitName==='trot'&&v<0.36) gaitName='walk';
  else if(gaitName==='canter'&&v>1.16) gaitName='gallop';
  else if(gaitName==='canter'&&v<0.72) gaitName='trot';
  else if(gaitName==='gallop'&&v<1.08) gaitName='canter';
  for(const k of GAITS) GW[k]+=((k===gaitName?1:0)-GW[k])*0.08;
  { let s=0; for(const k of GAITS) s+=GW[k]; for(const k of GAITS) GW[k]/=s; }
  let inv=0; for(const k of GAITS) inv+=GW[k]*2*RGAIT[k].stride/RGAIT[k].duty;
  if(P.onGround) walkT+=v/inv;
  P.vy=Math.min(P.vy+0.3,5); moveY(P.vy);
  P.onGround=collides(P.x,P.y+0.5);
  const mv=(P.onGround&&v>0.03)?1:0;
  moveBlend+=(mv-moveBlend)*0.12;
  liftBlend+=(mv-liftBlend)*(mv?0.12:0.35);
  if(P.onGround&&!wasGround){ landT=8; spawnChips(pcx(),P.y+P.h-1,'#7a6048',4,0.08); }
  wasGround=P.onGround; if(landT>0) landT--;
  if(actT>0) actT--;
  idleT=(moveBlend<0.05&&P.onGround)?idleT+1:0;
  while(throwReq>0){ throwReq--; if(uiMode==='none') throwCoin(); }
  while(takeReq>0){ takeReq--; takeCoin(); }

  if(P.onGround&&v>0.75&&tick%(v>1.1?3:6)===0)
    puffs.push({x:pcx()-P.face*11,y:P.y+P.h-1,vx:-P.face*(0.15+rnd()*0.15),vy:-0.12-rnd()*0.12,r:1.2,life:28,max:28,c:'160,138,110'});
  if(tick%22===0) for(const c of CAMPS) puffs.push({x:c.x*T+(rnd()-.5)*2,y:GY*T-8,vx:0.05+rnd()*0.04,vy:-0.22-rnd()*0.08,r:1,life:110,max:110,c:'200,190,205'});
  if(tick%14===0) ripples.push({x:rnd(),y:rnd(),r:0.5,life:40});

  if(++rabbitAcc>=BAL.rabbitEvery){ rabbitAcc=0; if(rabbits.length<BAL.rabbitMax){ const x=rabbitSpot(); if(x!==null){ spawnRabbit(x); spawnChips(x,GY*T-2,'#5f8a46',3,0.05); } } }
  for(const r of rabbits) stepRabbit(r);
  for(const q of sheep) stepSheep(q);
  sheep=sheep.filter(q=>!q.dead);
  stepBirds();
  updCoins();
  let wi=0;
  for(const p of people.slice()){
    if(p.state==='vagrant') stepVagrant(p);
    else if(p.state==='archer') stepArcher(p);
    else if(p.state==='farmer'){ if(!p.barn) p.idx=wi++; stepFarmer(p); }
    else if(p.state==='fisher') stepFisher(p);
    else { if(p.task==='follow') p.idx=wi++; stepWorker(p); }
  }
  updArrows();
  for(const t of trees) if(t.grow<1) t.grow=Math.min(1,t.grow+1/900);
  for(const b of buildings){ if(b.glow>0) b.glow--;
    if(b.scaffolder&&(people.indexOf(b.scaffolder)<0||b.scaffolder.task!=='scaffold'||b.scaffolder.dest!==b)) b.scaffolder=null; if(b.type==='mill'&&b.stage==='done'&&!b.ripe){ b.grow=(b.grow||0)+1/(BAL.mill.grow*60); if(b.grow>=1){ b.grow=1; b.ripe=true; } } }
  updateUI();

  const lead=P.face*clamp(v*22,0,30);
  camX+=(clamp(pcx()-VW/2+lead,0,W*T-VW)-camX)*0.08;
  for(const p of parts){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--; }
  parts=parts.filter(p=>p.life>0);
  for(const p of puffs){ p.x+=p.vx; p.y+=p.vy; p.r+=0.03; p.life--; }
  puffs=puffs.filter(p=>p.life>0);
  for(const r of ripples){ r.life--; r.r+=0.25; }
  ripples=ripples.filter(r=>r.life>0);
  for(const tr of trees) if(tr.sh>0) tr.sh--;
  for(const f of fallen){ f.t++; if(f.t===22){ spawnChips(f.x*T+4+f.dir*40,GY*T-4,'#5f8a46',10,0.05); spawnChips(f.x*T+4+f.dir*20,GY*T-2,'#7a5638',6); } }
  fallen=fallen.filter(f=>f.t<40);
}

// ================= отрисовка =================
function band(img,p,cx,baseY){

    const mg=ctx.createRadialGradient(mX,mY,2,mX,mY,40);
    mg.addColorStop(0,`rgba(220,230,255,${0.3*mA})`); mg.addColorStop(1,'rgba(220,230,255,0)');
    ctx.fillStyle=mg; ctx.fillRect(mX-40,mY-40,80,80);
    ctx.fillStyle=`rgba(236,240,255,${mA})`; ctx.beginPath(); ctx.arc(mX,mY,6,0,7); ctx.fill();
    ctx.fillStyle=mix('#171c34','#0c1024',0.5); ctx.globalAlpha=mA; ctx.beginPath(); ctx.arc(mX+3,mY-2,5,0,7); ctx.fill(); ctx.globalAlpha=1;
  }
  band(FAR_BAND,0.1,cx,gy-6);
  band(ROCK_BAND,0.25,cx,gy+2);
  const mist=ctx.createLinearGradient(0,gy-40,0,gy);
  mist.addColorStop(0,'rgba(215,160,175,0)'); mist.addColorStop(1,`rgba(215,160,175,${0.35*(1-dk*0.7)})`);
  ctx.fillStyle=mist; ctx.fillRect(0,gy-40,VW,40);
  // тучи надвигаются к ночи
  const cloudA=clamp((dk-0.15)/0.6,0,1)*0.85;
  if(cloudA>0){
    ctx.fillStyle=`rgba(34,30,48,${cloudA})`;
    for(let i=0;i<9;i++){
      const x=((i*97-cx*0.12-anim*(3+i%3))%(VW+120)+VW+120)%(VW+120)-60, y=8+(i*13)%30;
      ctx.beginPath(); ctx.ellipse(x,y+6,30,7,0,0,7); ctx.ellipse(x+18,y+2,20,8,0,0,7); ctx.ellipse(x-16,y+4,16,6,0,0,7); ctx.fill();
    }
  }
  band(TREE_BAND,0.5,cx,gy+1);
  ctx.drawImage(GROUND_BAND,cx,0,VW,GROUND_BAND.height,0,gy-4,VW,GROUND_BAND.height);

  for(const b of bushes){ const sx=b.x*T-cx; if(sx<-40||sx>VW+40) continue; const img=BUSH_SPR[b.v], sw=Math.round(Math.sin(anim*1.2+b.ph)*0.6); ctx.drawImage(img,Math.round(sx-img.width/2)+sw,gy-img.height+1); }
  for(const sx0 of stumps){ const sx=Math.round(sx0*T+4-cx); if(sx<-6||sx>VW+6) continue; ctx.fillStyle='#2b2019'; ctx.fillRect(sx-3,gy-3,6,3); ctx.fillStyle='#8a6a48'; ctx.fillRect(sx-2,gy-3,4,1); }
  for(const tr of trees){
    const sx=tr.x*T+4-cx; if(sx<-60||sx>VW+60) continue;
    const img=TREE_SPR[tr.v];
    if(tr.grow<1){                                          // молодое дерево подрастает
      const k=0.3+0.7*tr.grow, w=Math.round(img.width*k), h=Math.round(img.height*k);
      ctx.drawImage(img,Math.round(sx-w/2),gy+1-h,w,h); continue;
    }
    const sway=Math.sin(anim*1.1+tr.ph)*0.8, shake=tr.sh>0?((tr.sh&1)?1.5:-1.5):0;
    drawTreeSprite(img,Math.round(sx),gy+1,sway,shake);
    const by=gy-img.height-6+Math.round(Math.sin(anim*3+tr.x));
    if(tr.marked) iconCoin(Math.round(sx)-2,by);
    else{ const d=Math.abs(tr.x*T+4-pcx()); if(d<90) iconSlot(Math.round(sx)-2,by,(d<28?1:0.6)*(0.8+0.2*Math.sin(anim*4))); }
  }
  for(const f of fallen){
    const sx=f.x*T+4-cx; if(sx<-90||sx>VW+90) continue;
    const img=TREE_SPR[f.v], k=Math.min(1,f.t/22), ang=k*k*1.45*f.dir;
    ctx.save(); ctx.globalAlpha=f.t>26?Math.max(0,1-(f.t-26)/14):1;
    ctx.translate(Math.round(sx),gy+1); ctx.rotate(ang); ctx.drawImage(img,-Math.floor(img.width/2),-img.height); ctx.restore();
  }
  for(const t of tents) drawTent(t,cx,gy);
  for(const c of CAMPS) drawCampFire(c,cx,gy);
  for(const b of buildings) drawBuilding(b,cx,gy);
  drawWalls(cx,gy);
  drawGhost(cx,gy);
  for(const l of logs){ const sx=Math.round(l.x-cx); if(sx<-10||sx>VW+10) continue; ctx.fillStyle='#2a1a10'; ctx.fillRect(sx-6,gy-4,13,4); ctx.fillStyle='#8a5e38'; ctx.fillRect(sx-5,gy-3,11,2); ctx.fillStyle='#c79a62'; ctx.fillRect(sx+5,gy-3,1,2); }
  for(const r of rabbits){
    const sx=Math.round(r.x-cx); if(sx<-8||sx>VW+8) continue;
    const y=gy+Math.round(r.y), air=r.y<-0.5;
    ctx.save(); ctx.translate(sx,y); ctx.scale(r.face,1);
    ctx.fillStyle='#2a201c'; if(air){ ctx.fillRect(-4,-5,8,3); ctx.fillRect(1,-7,4,3); } else { ctx.fillRect(-4,-5,7,5); ctx.fillRect(0,-7,4,4); }
    ctx.fillStyle='#8a7462'; if(air){ ctx.fillRect(-3,-4,6,1); ctx.fillRect(2,-6,2,2); } else { ctx.fillRect(-3,-4,5,3); ctx.fillRect(1,-6,2,2); }
    ctx.fillStyle='#b8a48e'; ctx.fillRect(-2,-4,2,1);
    const ear=Math.sin(anim*2+r.ear)>0.8?1:0;
    ctx.fillStyle='#2a201c'; ctx.fillRect(air?2:1,-10+ear,1,3); ctx.fillRect(air?3:2,-10,1,3);
    ctx.fillStyle='#8a7462'; ctx.fillRect(air?2:1,-9+ear,1,1);
    ctx.fillStyle='#0a0808'; ctx.fillRect(air?4:2,-6,1,1);
    ctx.fillStyle='#f4efe6'; ctx.fillRect(air?-5:-4,-4,1,1);

  ctx.strokeStyle='#6e9c48'; ctx.lineWidth=1; ctx.beginPath();
  const x0=Math.max(0,Math.floor(cx/T)), x1=Math.min(W-1,Math.floor((cx+VW)/T)+1);
  for(let x=x0;x<=x1;x++) for(let k=0;k<2;k++){ const bx=x*T+k*4+2-cx, h=2+(hash(x,k)%4), tip=Math.sin(anim*2+x*0.7+k)*1.2; ctx.moveTo(bx+0.5,gy); ctx.lineTo(bx+0.5+tip,gy-h); }
  ctx.stroke();
  for(const p of puffs){ ctx.fillStyle=`rgba(${p.c},${0.28*p.life/p.max})`; ctx.beginPath(); ctx.arc(p.x-cx,p.y-oy,p.r,0,7); ctx.fill(); }
  const farmerHere=people.some(q=>q.state==='farmer'&&q.barn);
  for(const q of sheep){
    if(q.state==='in') continue;
    const sx=Math.round(q.x-cx); if(sx<-10||sx>VW+10) continue;
    const k=q.adult?1:0.7, leg=q.moving?(Math.floor(q.walk)%2):0, bob=q.moving?0:(Math.sin(anim*1.2+q.ph)>0.9?1:0);
    ctx.save(); ctx.translate(sx,gy); ctx.scale(q.face,1);
    const bw=Math.round(10*k), bh=Math.round(6*k);
    ctx.fillStyle='#2a2028'; ctx.fillRect(-Math.floor(bw/2)+1,-3,1,3-leg); ctx.fillRect(Math.floor(bw/2)-2,-3,1,3-(1-leg)); ctx.fillRect(-Math.floor(bw/2)+3,-3,1,3-(1-leg)); ctx.fillRect(Math.floor(bw/2)-4,-3,1,3-leg);
    ctx.fillStyle='#6a6070'; ctx.fillRect(-Math.floor(bw/2)-1,-3-bh,bw+2,bh);
    ctx.fillStyle='#f0ece4'; ctx.fillRect(-Math.floor(bw/2),-2-bh,bw,bh-1);
    ctx.fillStyle='#ffffff'; ctx.fillRect(-Math.floor(bw/2)+1,-2-bh,Math.max(2,bw-4),1);
    ctx.fillStyle='#2a2028'; ctx.fillRect(Math.floor(bw/2)-1,-2-bh+bob+1,3,3);
    ctx.fillStyle='#0a0808'; ctx.fillRect(Math.floor(bw/2)+1,-1-bh+bob+1,1,1);
    ctx.restore();
    const by=gy-Math.round(14*k);
    if(q.marked) iconCoin(sx-2,by-6);
    else if(q.adult&&farmerHere&&q.barn.farmer&&flockOf(q.barn).length>=BAL.sheepMin&&Math.abs(q.x-pcx())<70) iconSlot(sx-2,by-6,(Math.abs(q.x-pcx())<26?1:0.55)*(0.8+0.2*Math.sin(anim*4)));
  }

  for(const p of people) if(p.state==='vagrant'||p.state==='archer'||p.task!=='follow') drawPerson(p,cx,gy);
  drawRider(pcx()-cx,P.y+P.h-oy,P.face,walkT,anim,P.onGround,clamp(Math.abs(P.vx)/1.4,0,1));
  for(const p of people) if(p.state!=='vagrant'&&p.state!=='archer'&&p.task==='follow') drawPerson(p,cx,gy);
  for(const b of birds) drawBird(b,cx,oy);
  for(const ar of arrows){ const x=Math.round(ar.x-cx), y=Math.round(ar.y-oy), dx=Math.sign((ar.x-(ar.px??ar.x))||1); ctx.fillStyle='#e8e0c8'; ctx.fillRect(x-dx*3,y,3,1); ctx.fillStyle='#8a8aa0'; ctx.fillRect(x,y,1,1); }
  for(const c of coins){ const x=Math.round(c.x-cx)-2, y=Math.round(c.y-oy)-2; if(x<-6||x>VW+6) continue; const spin=Math.floor(anim*10+c.age)%4; if(!c.ground&&spin===1){ ctx.fillStyle='#4a3010'; ctx.fillRect(x+2,y,1,5); ctx.fillStyle='#e8b830'; ctx.fillRect(x+2,y+1,1,3); } else iconCoin(x,y); }
  for(const p of parts){ ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x-cx),Math.round(p.y-oy),1,1); }

  // ночь: общее затемнение, потом тёплый свет огней
  if(dk>0.01){ ctx.fillStyle=`rgba(10,14,38,${0.58*dk})`; ctx.fillRect(0,0,VW,waterTop); }
  ctx.globalCompositeOperation='lighter';
  const lights=CAMPS.map(c=>({x:c.x*T,y:GY*T-8,r:26}));
  for(const b of buildings) if(b.stage==='done'&&b.type==='hall') lights.push({x:b.x,y:GY*T-28,r:34});
  for(const L of lights){
    const gx=L.x-cx; if(gx<-40||gx>VW+40) continue;
    const ly=L.y-oy, f=0.85+0.15*Math.sin(anim*9+L.x), r=L.r*(1+dk*0.4);
    const rg=ctx.createRadialGradient(gx,ly,0,gx,ly,r);
    rg.addColorStop(0,`rgba(255,180,110,${(0.25+0.3*dk)*f})`); rg.addColorStop(1,'rgba(255,180,110,0)');
    ctx.fillStyle=rg; ctx.fillRect(gx-r,ly-r,r*2,r*2);
  }
  ctx.globalCompositeOperation='source-over';

  const wh=VH-waterTop;
  if(wh>0){
    sctx.clearRect(0,0,VW,VH); sctx.drawImage(cv,0,0);
    const wg=ctx.createLinearGradient(0,waterTop,0,VH);
    wg.addColorStop(0,mix('#c98c9c','#2a2a48',dk)); wg.addColorStop(1,mix('#6a6f98','#121428',dk));
    ctx.fillStyle=wg; ctx.fillRect(0,waterTop,VW,wh);
    for(let r=0;r<wh;r++){
      const src=gy-1-r; if(src<0) break;
      const off=Math.round(Math.sin(anim*1.6+r*0.55)*Math.min(2,0.3+r*0.05));
      ctx.globalAlpha=0.9-0.25*r/wh;
      ctx.drawImage(snap,0,src,VW,1,off,waterTop+r,VW,1);
    }
    ctx.globalAlpha=1;
    const tint=ctx.createLinearGradient(0,waterTop,0,VH);
    tint.addColorStop(0,'rgba(60,40,80,0.10)'); tint.addColorStop(1,'rgba(30,30,70,0.38)');
    ctx.fillStyle=tint; ctx.fillRect(0,waterTop,VW,wh);
    ctx.fillStyle=`rgba(255,225,230,${0.22*(1-dk*0.6)})`;
    for(let i=0;i<18;i++){ const x=((i*61+anim*(4+i%3))%(VW+20))-10, y=waterTop+3+((i*13)%Math.max(1,wh-4)); ctx.fillRect(Math.round(x),Math.round(y),3+(i%3)*2,1); }
    ctx.strokeStyle='rgba(255,230,240,0.45)'; ctx.lineWidth=1;
    for(const r of ripples){ ctx.globalAlpha=r.life/40*(1-dk*0.5); ctx.beginPath(); ctx.ellipse(r.x*VW,waterTop+4+r.y*(wh-8),r.r*2,r.r*0.5,0,0,7); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  for(const c of clumps){ const sx=c.x*T-cx; if(sx<-10||sx>VW+10) continue; for(let k=0;k<c.n;k++){ const bx=Math.round(sx+k*2), h=4+(hash(c.x,k)%5), tip=Math.round(Math.sin(anim*1.8+c.ph+k)*1); ctx.fillStyle=k%2?'#86b450':'#5f8f3a'; ctx.fillRect(bx,waterTop-h,1,h); ctx.fillRect(bx+tip,waterTop-h-1,1,1); } }
  if(dk>0.01){ ctx.fillStyle=`rgba(10,14,38,${0.4*dk})`; ctx.fillRect(0,waterTop-8,VW,8); }
  for(const m of MOTES){ const x=((m.x*VW*2-cx*m.s*0.5+anim*3*m.s)%VW+VW)%VW, y=(m.y*gy*0.95+Math.sin(anim*0.8+m.p)*3); ctx.fillStyle=`rgba(255,240,230,${(0.35+0.35*Math.sin(anim*2+m.p))*(dk>0.5?1.3:1)})`; ctx.fillRect(Math.round(x),Math.round(y),1,1); }
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.45,VW/2,VH/2,VW*0.75);
  vg.addColorStop(0,'rgba(20,10,30,0)'); vg.addColorStop(1,`rgba(20,10,30,${0.3+0.2*dk})`);
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<COIN_MAX;i++) iconCoin(6+i*6,6,i<purse);
  // индикатор суток: полоска 10 минут (день → ночь → рассвет), бегунок — сейчас
  { const bx=6+COIN_MAX*6+8, by=7, bw=54, t=dayClock%BAL.dayLen;
    ctx.fillStyle='rgba(20,12,24,0.7)'; ctx.fillRect(bx-1,by-1,bw+2,5);
    for(let i=0;i<bw;i++){ ctx.fillStyle=mix('#f2c46e','#1c2350',darkAt(i/bw*BAL.dayLen)); ctx.fillRect(bx+i,by,1,3); }
    const mx=bx+Math.round(t/BAL.dayLen*bw);
    ctx.fillStyle='rgba(20,12,24,0.9)'; ctx.fillRect(mx-1,by-2,3,7); ctx.fillStyle='#fff4dc'; ctx.fillRect(mx,by-1,1,5);
    const ix=bx+bw+4;
    if(dk<0.5){ ctx.fillStyle='#f6c85a'; ctx.fillRect(ix+1,by-1,3,5); ctx.fillRect(ix,by,5,3); ctx.fillStyle='#fff0b0'; ctx.fillRect(ix+1,by,1,1); }
    else { ctx.fillStyle='#e8ecff'; ctx.fillRect(ix+1,by-1,3,5); ctx.fillRect(ix,by,5,3); ctx.fillStyle='#1c2350'; ctx.fillRect(ix+2,by-1,3,4); }
  }
  dctx.drawImage(cv,0,0,VW*DS,VH*DS);
}

// ================= сохранение =================
// Хранится в браузере игрока; переживает перезагрузку и обновления игры по той же ссылке.
// Shift+R на клавиатуре — начать заново.
const SAVE_KEY='kingcamp-save-v1';
let resetting=false;
function saveGame(){
  if(resetting||!bootDone) return;          // пока не прочитали облако — не затираем прогресс
  try{
    const bi=b=>buildings.indexOf(b);
    const data={v:1,walls,P:{x:P.x,face:P.face},purse:Math.min(COIN_MAX,purse+incomingPurse()),dayClock,dayNum,
      trees:trees.map(t=>[t.x,t.hp,t.v,t.marked?1:0,t.grow]),
      stumps, logs:logs.map(l=>l.x),
      coins:coins.filter(c=>!c.flight).map(c=>[Math.round(c.x),c.bounty?1:0]),
      rabbits:rabbits.map(r=>[Math.round(r.x),Math.round(r.home)]),
      buildings:buildings.map(b=>({type:b.type,x:b.x,stage:b.stage,coins:b.coins||0,need:b.need,wood:b.wood,progress:b.progress,bank:b.bank||0,w:b.w,level:b.level||1,side:b.side??null,lvl:b.lvl??null,of:b.of?bi(b.of):-1,pasture:b.pasture??null,grow:b.grow||0,ripe:!!b.ripe,ordered:!!b.ordered,t0:b.t0||0,tDur:b.tDur||0})),
      sheep:sheep.map(q=>[Math.round(q.x),bi(q.barn),q.adult?1:0,q.born,q.marked?1:0,q.state]),
      people:people.map(p=>({x:Math.round(p.x),state:p.state,camp:CAMPS.indexOf(p.camp),shirt:p.shirt,pouch:p.pouch,wage:p.wage,wageT:p.wageT,
        coin:p.coin,logs:p.logs,tower:p.tower?bi(p.tower):-1,barn:p.barn?bi(p.barn):-1,trainTo:p.trainTo,trainDest:p.task==='train'?bi(p.dest):-1}))};
    data.at=Date.now();
    const json=JSON.stringify(data);
    try{ localStorage.setItem(SAVE_KEY,json); }catch(_){}
    cloudSave(json,data.at);
  }catch(_){}
}
function readLocal(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(_){ return null; } }
function loadGame(d){
  if(d===undefined) d=readLocal();
  if(!d||d.v!==1) return false;
  try{
    P.x=d.P.x; P.face=d.P.face; purse=d.purse; dayClock=d.dayClock; dayNum=d.dayNum;
    trees=d.trees.map(a=>{ const t=newTree(a[0]); t.hp=a[1]; t.v=a[2]%TREE_SPR.length; t.marked=!!a[3]; t.grow=a[4]; return t; });
    stumps=d.stumps.slice();
    logs=d.logs.map(x=>({x,taken:null}));
    coins=d.coins.map(a=>({x:a[0],y:GY*T-2,vx:0,vy:0,ground:true,age:200,flight:null,bounty:!!a[1],claim:null}));
    rabbits=[]; for(const a of d.rabbits){ spawnRabbit(a[0]); rabbits[rabbits.length-1].home=a[1]; }
    buildings=d.buildings.map(b=>Object.assign({},b,{incoming:0,glow:0,scaffolder:null,archer:null,farmer:null,out:false,harvester:null,reaping:false}));
    for(const b of buildings){ if(b.of>=0&&buildings[b.of]) b.of=buildings[b.of]; else delete b.of; if(b.pasture===null) delete b.pasture; }
    walls=d.walls&&d.walls.level!=null?{level:d.walls.level,hp:(d.walls.hp||[0,0]).slice()}:{level:0,hp:[0,0]};
    if(walls.level<1&&buildings[0]&&buildings[0].stage==='done') setWallLevel(1);
    sheep=[]; for(const a of (d.sheep||[])){ const b=buildings[a[1]]; if(!b) continue; addSheep(b,!!a[2]); const q=sheep[sheep.length-1]; q.x=a[0]; q.born=a[3]; q.marked=!!a[4]; q.state=a[5]==='in'?'in':'out'; q.wx=q.x; }
    people=d.people.map(q=>{
      const p=newPerson(q.x,CAMPS[q.camp]||CAMPS[0]);
      Object.assign(p,{state:q.state,shirt:q.shirt,pouch:q.pouch||0,wage:q.wage||0,wageT:q.wageT||0,coin:q.coin||0});
      p.task=q.state==='archer'?'roam':(p.coin>0?'bring':'follow');
      for(let i=0;i<(q.logs||0);i++) logs.push({x:q.x+i*6,taken:null});
      if(q.tower>=0&&buildings[q.tower]){ p.tower=buildings[q.tower]; buildings[q.tower].archer=p; p.task='tower'; }
      if(q.state==='fisher') p.task='fish';
      if(q.state==='farmer'){ p.task='farm'; if(q.barn>=0&&buildings[q.barn]){ p.barn=buildings[q.barn]; buildings[q.barn].farmer=p; } }
      if(q.trainDest>=0&&buildings[q.trainDest]){ p.task='train'; p.trainTo=q.trainTo; p.dest=buildings[q.trainDest]; }
      return p;
    });
    camX=clamp(pcx()-VW/2,0,W*T-VW);
    return true;
  }catch(_){ return false; }
}
loadGame();
// ---- облачное сохранение: личная папка игрока в аккаунте claude.ai (видна только ему) ----
let bootDone=false, cloudRef=null, cloudReady=false, cloudBusy=false, cloudLastAt=0, cloudPending=null, bootTries=0;
function cloudSave(json,at){
  if(!cloudRef||!cloudReady) return;
  cloudPending={json,at};
  if(cloudBusy) return;
  if(at-cloudLastAt<15000&&!document.hidden) return;           // не чаще раза в 15 с, при сворачивании — сразу
  const job=cloudPending; cloudPending=null; cloudBusy=true;
  cloudRef.set({json:job.json,at:job.at}).then(()=>{ cloudLastAt=job.at; }).catch(()=>{}).finally(()=>{ cloudBusy=false; });
}
async function cloudBoot(){
  bootTries++;
  try{
    if(!window.claude||!window.claude.use){ bootDone=true; return; }
    const db=await window.claude.use('db'), user=await window.claude.use('user');
    if(!db||!user){ bootDone=true; return; }
    const uid=await user.id(); if(!uid){ bootDone=true; return; }
    cloudRef=db.doc('data/users/'+uid+'/save');
    const snap=await Promise.race([cloudRef.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
    const d=snap&&snap.exists?snap.data():null, local=readLocal();
    if(d&&typeof d.json==='string'&&(!local||(d.at||0)>(local.at||0))){
      if(loadGame(JSON.parse(d.json))){ try{ localStorage.setItem(SAVE_KEY,d.json); }catch(_){} }
    }
    cloudReady=true; bootDone=true; saveGame();
  }catch(_){
    if(bootTries<3) setTimeout(cloudBoot,8000);                // облако не ответило — пробуем ещё
    else bootDone=true;                                         // играем с сохранением только в браузере
  }
}
cloudBoot();
setInterval(saveGame,4000);
addEventListener('pagehide',saveGame);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveGame(); });

let acc=0, lastT=performance.now();
function frame(now){
  const dt=Math.min((now-lastT)/1000,0.1); lastT=now;
  acc+=dt; anim+=dt;
  while(acc>=1/60){ stepPhysics(); acc-=1/60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
